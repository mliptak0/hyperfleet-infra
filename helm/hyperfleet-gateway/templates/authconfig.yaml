{{- if .Values.auth.extAuthz.enabled }}
{{- $model := .Values.tenant.model | default "onprem" }}
{{- $cfg := index .Values.tenant.models $model }}
{{- if not $cfg }}
{{- fail (printf "tenant.model %q not found in .Values.tenant.models (expected e.g. onprem|oracle)" $model) }}
{{- end }}
{{- if not .Values.auth.oidc.issuerUrl }}
{{- fail "auth.oidc.issuerUrl (OIDC_ISSUER_URL) is required when auth.extAuthz.enabled=true: the gateway is fail-closed and an empty issuer means every request is denied" }}
{{- end }}
{{- if not (regexMatch "^https://" .Values.auth.oidc.issuerUrl) }}
{{- fail (printf "auth.oidc.issuerUrl must be an https:// URL (got: %q)" .Values.auth.oidc.issuerUrl) }}
{{- end }}
{{- if not .Values.auth.machineIdentity.allowedComponents }}
{{- fail "auth.machineIdentity.allowedComponents must not be empty: an empty list renders a restrict-system-subjects pattern that matches no valid SA, but also can't be trusted to fail closed as intended - set it explicitly instead" }}
{{- end }}
{{- $allowedComponentsPattern := list }}
{{- range .Values.auth.machineIdentity.allowedComponents }}
{{- $allowedComponentsPattern = append $allowedComponentsPattern (regexQuoteMeta .) }}
{{- end }}
# Human OIDC tenant policy (stable name; model swap replaces in place).
apiVersion: authorino.kuadrant.io/v1beta3
kind: AuthConfig
metadata:
  name: hyperfleet-tenant-policy
  labels:
    {{- include "hyperfleet-gateway.labels" . | nindent 4 }}
spec:
  # Matched request authority: always the gateway Service DNS + localhost,
  # plus any extra hostnames configured via authorino.hosts (AUTHORINO_HOSTS).
  hosts:
    - {{ include "hyperfleet-gateway.fullname" . | quote }}
    - {{ printf "%s.%s.svc.cluster.local" (include "hyperfleet-gateway.fullname" .) .Release.Namespace | quote }}
    - "localhost"
    {{- range .Values.auth.authorino.hosts }}
    - {{ . | quote }}
    {{- end }}
  authentication:
    # Machine identity for adapters/sentinels, via TokenReview
    # priority must stay below human-jwt's: same-priority methods race, and on
    # GKE the human OIDC issuer can also sign ServiceAccount tokens, so a race
    # would let the (faster, local) JWT check misclassify machine callers.
    "hyperfleet-components":
      priority: 0
      kubernetesTokenReview:
        audiences:
          - {{ .Values.auth.machineIdentity.audience | quote }}
      credentials:
        authorizationHeader: {}
      defaults:
        hf_system:
          value: "true"
    "human-jwt":
      priority: 1
      jwt:
        # TODO(HYPERFLEET-1485): kind needs mock IdP for oidc.issuerUrl in e2e.
        issuerUrl: {{ .Values.auth.oidc.issuerUrl | quote }}
      credentials:
        authorizationHeader: {}
      defaults:
        hf_system:
          value: "false"
  authorization:
    # Restricts machine callers to Sentinel/adapter ServiceAccounts in this
    # release's namespace - the audience alone is not the credential. Matches
    # the "-hyperfleet-<component>" suffix from those charts' .fullname
    # templates rather than enumerating release names (e.g. adapter1,
    # nodepools), which vary per instance; add new callers via
    # auth.machineIdentity.allowedComponents (values.yaml).
    "restrict-system-subjects":
      when:
        - selector: auth.identity.hf_system
          operator: eq
          value: "true"
      patternMatching:
        patterns:
          - selector: auth.identity.user.username
            operator: matches
            value: {{ printf "^system:serviceaccount:%s:.*-hyperfleet-(%s)$" .Release.Namespace ($allowedComponentsPattern | join "|") | quote }}
    # Required tenant claim must be non-empty.
    {{ $cfg.requiredRule | quote }}:
      when:
        - selector: auth.identity.hf_system
          operator: neq
          value: "true"
      patternMatching:
        patterns:
          - selector: auth.identity.{{ $cfg.required.claim }}
            operator: neq
            value: ""
  response:
    success:
      headers:
        # "true" for machine callers (hyperfleet-components), "false" for humans.
        x-hyperfleet-system:
          plain:
            selector: auth.identity.hf_system
        x-hyperfleet-identity:
          # when-gated: machine callers have no email claim (avoids "<nil>").
          when:
            - selector: auth.identity.email
              operator: neq
              value: ""
          plain:
            selector: auth.identity.email
        {{ $cfg.required.header | quote }}:
          # when-gated: machine callers are exempt from the required claim (see
          # the {{ $cfg.requiredRule }} authorization rule above) and have no
          # claim to put here (avoids "<nil>").
          when:
            - selector: auth.identity.{{ $cfg.required.claim }}
              operator: neq
              value: ""
          plain:
            selector: auth.identity.{{ $cfg.required.claim }}
        {{ $cfg.optional.header | quote }}:
          # when-gated: omit optional header when claim absent (avoids "<nil>").
          when:
            - selector: auth.identity.{{ $cfg.optional.claim }}
              operator: neq
              value: ""
          plain:
            selector: auth.identity.{{ $cfg.optional.claim }}
{{- end }}
